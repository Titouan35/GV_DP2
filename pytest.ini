[pytest]
# Sans testpaths, `pytest` sans argument collecte runtime/ (7 900 fichiers) et
# s'arrete sur une dependance manquante de numpy au bout de 47 secondes.
# Releve le 01/09/2026 : le README donnait pourtant cette commande.
testpaths = tests
addopts = -m "not live"
markers =
    live: appels réels aux APIs open data (réseau requis, pas de SLA)
