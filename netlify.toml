# Netlify comme porte d'entrée de GV_DP.
#
# À LIRE AVANT DE MODIFIER : Netlify n'exécute PAS cette application, et ne le
# peut pas. Les Netlify Functions n'acceptent que JavaScript et TypeScript ;
# GV_DP est une application Python (FastAPI) qui tourne en continu, écrit des
# fichiers sur disque et pilote LibreOffice pour l'export PDF. Aucun réglage ne
# change cela.
#
# Ce que Netlify fait très bien ici : porter le domaine, le certificat HTTPS et
# le relais. L'application tourne sur un hébergeur de conteneurs, Netlify relaie
# vers elle. C'est un montage courant et pris en charge nativement (rewrite en
# status 200 vers une URL absolue).
#
# LIMITE À CONNAÎTRE : un relais Netlify expire à 26 secondes.
# Mesuré sur un dossier réel (Rive-de-Gier, 8 planches, cartes IGN comprises) :
#   assemblage PPTX      10,4 s à froid, 8,0 s à chaud   -> passe largement
#   export PDF           non mesuré ici (LibreOffice n'existe pas sous Windows)
# L'export PDF est le seul appel susceptible de dépasser les 26 s sur un gros
# dossier. S'il expire, le PPTX reste téléchargeable : on ne perd pas le travail.
# Si le cas devient gênant, voir HEBERGEMENT.md, option du sous-domaine direct.

[build]
  # Rien à construire : le site Netlify ne sert qu'une page de repli, affichée
  # uniquement si le relais ci-dessous n'est pas encore configuré.
  publish = "netlify/public"
  command = "echo 'GV_DP : rien a construire, Netlify sert de relais'"

# ---------------------------------------------------------------------------
# RELAIS vers l'application.
#
# Remplace BACKEND par le domaine de ton hébergeur de conteneurs, par exemple
#   https://gv-dp.exemple.scw.cloud
# puis redéploie le site Netlify.
#
# Tant que cette ligne porte l'adresse d'exemple, le relais échoue et la page de
# repli s'affiche : c'est voulu, mieux vaut une page qui explique qu'une erreur
# opaque.
# ---------------------------------------------------------------------------
[[redirects]]
  from = "/*"
  to = "https://BACKEND-A-REMPLACER/:splat"
  status = 200
  force = true
  # L'application place le cookie de session en « Secure » dès que la connexion
  # est chiffrée. Derrière un relais, elle ne voit qu'une requête HTTP interne :
  # sans cet en-tête, le cookie partirait sans l'attribut Secure.
  [redirects.headers]
    X-Forwarded-Proto = "https"

# Les dossiers contiennent des données personnelles : on interdit l'indexation
# et la mise en cache par les intermédiaires.
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Referrer-Policy = "same-origin"
    X-Content-Type-Options = "nosniff"
