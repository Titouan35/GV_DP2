<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>GV_DP · Déclaration Préalable — Ombrières</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%2305DB79' d='M13 2 4 14h6l-1 8 9-12h-6z'/%3E%3C/svg%3E" />
<link rel="stylesheet" href="/static/vendor/leaflet/leaflet.css" />
<link rel="stylesheet" href="/static/css/app.css?v=19" />
</head>
<body>
<div class="app">

  <header class="topbar">
    <div class="logo" title="Greenvolt Next">
      <img src="/static/img/greenvolt_logo.png?v=14" alt="Greenvolt Next" />
    </div>
    <div class="vdiv"></div>
    <div class="toolname">
      <span class="tn-app">Déclaration préalable · Ombrières photovoltaïques de parking</span>
      <span class="tn-sep" id="proj-badge" hidden>·</span>
      <span class="tn-proj" id="proj-nom"></span>
    </div>
    <button class="btn home-btn" id="btn-accueil" title="Projets" aria-label="Projets">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V20h14V9.5"/></svg>
    </button>
  </header>

  <div class="body">

    <aside class="side" id="sidebar">
      <nav id="stepper"></nav>
    </aside>

    <main class="main" id="main">
      <!-- contenu de l'étape active, rendu par app.js -->
    </main>

    <aside class="rightpanel" id="rightpanel">
      <div class="rp-title">Complétude du dossier</div>
      <div class="prog">
        <div class="ring">
          <svg width="70" height="70" viewBox="0 0 70 70">
            <circle cx="35" cy="35" r="30" fill="none" stroke="#EEF1F5" stroke-width="7" />
            <circle cx="35" cy="35" r="30" fill="none" stroke="#05DB79" stroke-width="7"
                    stroke-linecap="round" stroke-dasharray="0 188.5" transform="rotate(-90 35 35)" id="ring-arc" />
          </svg>
          <div class="ring-val"><b id="ring-txt">0</b><span id="ring-tot">/11</span></div>
        </div>
        <div class="txt"><span id="prog-label">Pièces prêtes</span><br /><b id="prog-sub">—</b></div>
      </div>
      <div id="pieces-list"></div>
      <div class="regime" id="regime-box">Déclaration préalable · &lt; 3&nbsp;MWc, hors secteur ABF · Cerfa 16702*03</div>
    </aside>

  </div>
</div>

<div id="toasts"></div>
<div id="lightbox" hidden><img id="lightbox-img" alt="Agrandissement" /></div>

<script src="/static/vendor/leaflet/leaflet.js"></script>
<script src="/static/js/app.js?v=19"></script>
</body>
</html>
