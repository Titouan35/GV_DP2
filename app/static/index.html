<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>GV_DP · Déclaration Préalable — Ombrières</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%2305DB79' d='M13 2 4 14h6l-1 8 9-12h-6z'/%3E%3C/svg%3E" />
<link rel="stylesheet" href="/static/vendor/leaflet/leaflet.css" />
<link rel="stylesheet" href="/static/css/app.css?v=15" />
</head>
<body>
<div class="app">

  <header class="topbar">
    <div class="logo" title="Greenvolt Next">
      <img src="/static/img/greenvolt_logo.png?v=14" alt="Greenvolt Next" />
    </div>
    <div class="vdiv"></div>
    <div class="toolname">Déclaration préalable<small>Ombrières photovoltaïques de parking</small></div>
    <div class="spacer"></div>
    <div class="proj" id="proj-badge" hidden><span id="proj-nom"></span></div>
    <button class="btn home-btn" id="btn-accueil" title="Retour aux projets" aria-label="Retour aux projets">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/><path d="M10 21v-6h4v6"/></svg>
    </button>
  </header>

  <div class="body">

    <aside class="side" id="sidebar">
      <h4>Étapes du dossier</h4>
      <nav id="stepper"></nav>
    </aside>

    <main class="main" id="main">
      <!-- contenu de l'étape active, rendu par app.js -->
    </main>

    <aside class="rightpanel" id="rightpanel">
      <div class="card">
        <div class="hd"><span class="ti-title">Complétude du dossier</span></div>
        <div class="prog">
          <div class="ring" id="ring" style="--p:0"><span id="ring-txt">0/12</span></div>
          <div class="txt"><b id="prog-label">Dossier vide</b><br /><span id="prog-sub">Renseignez les étapes</span></div>
        </div>
        <div id="pieces-list"></div>
      </div>
    </aside>

  </div>
</div>

<div id="toasts"></div>
<div id="lightbox" hidden><img id="lightbox-img" alt="Agrandissement" /></div>

<script src="/static/vendor/leaflet/leaflet.js"></script>
<script src="/static/js/app.js?v=15"></script>
</body>
</html>
